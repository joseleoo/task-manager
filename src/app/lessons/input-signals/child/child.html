<!-- Add this to child.html if you want a clear button in the child component too -->
<div class="child-controls">
    <button class="btn btn-primary" (click)="send()">
        <span class="icon">📤</span>
        Send Message to Parent
    </button>

    <button class="btn btn-secondary" (click)="clearChild()">
        <span class="icon">🧹</span>
        Clear
    </button>
</div>

@if (message()) {
<div class="child-message">
    <p>📩 Received from parent: {{ message() }}</p>
</div>
}
